<!-- web/index.html -->
<!doctype html>
<html>
  <head>
    <title>YouTube Transcript Bookmarklet</title>
  </head>
  <body>
    <h1>YouTube Transcript Bookmarklet</h1>

    <p>Drag this button to your bookmarks bar:</p>

    <a
      href="javascript:(()=>{const s=document.createElement('script');s.src='https://coleman-zachery.github.io/youtube-transcript-bookmarklet/youtube-transcript.js?v='+Date.now();document.body.appendChild(s);})();"
      style="display:inline-block;padding:14px 18px;border-radius:999px;background:#111;color:white;text-decoration:none;font-family:sans-serif;font-weight:700;"
    >
      Copy YouTube Transcript
    </a>

    <ol>
      <li>Show your bookmarks bar.</li>
      <li>Drag the button above into it.</li>
      <li>Open a YouTube video.</li>
      <li>Click the bookmarklet.</li>
    </ol>
  </body>
</html>
